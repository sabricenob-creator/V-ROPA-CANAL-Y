<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio | Venta de Ropa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { color: #111; background: #fff; }

    /* ====== BARRA DE ANUNCIO (negra) ====== */
    .announcement {
      background: #000; color: #fff;
      text-align: center; padding: 10px 20px;
      font-size: 14px; letter-spacing: 0.5px;
    }

    /* ====== HEADER / MENÚ ====== */
    header {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      align-items: stretch;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
      position: sticky; top: 0; z-index: 100;
    }

    /* Logo con fondo verde lima */
    .logo {
      background: #d4f000;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 26px; letter-spacing: 1px;
      color: #000; text-transform: uppercase;
      padding: 25px 20px;
    }

    /* Navegación central */
    nav ul {
      list-style: none;
      display: flex; align-items: stretch; justify-content: center;
      height: 100%;
    }
    nav li {
      display: flex; align-items: center;
      border-right: 1px solid #e5e5e5;
    }
    nav li:first-child { border-left: 1px solid #e5e5e5; }
    nav a {
      text-decoration: none; color: #333;
      font-size: 15px; padding: 0 45px;
      height: 100%; display: flex; align-items: center;
      transition: background 0.2s, color 0.2s;
      text-transform: capitalize;
    }
    nav a:hover { background: #fafafa; color: #000; }

    /* Acciones a la derecha */
    .acciones {
      display: flex; align-items: center;
      border-left: 1px solid #e5e5e5;
      padding: 0 25px; gap: 25px;
    }
    .acciones a {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: #333; font-size: 15px;
    }
    .acciones .icon { font-size: 18px; }
    .carrito { position: relative; }
    .carrito .badge {
      position: absolute; top: -6px; right: -8px;
      background: #d4f000; color: #000;
      font-size: 11px; font-weight: 700;
      padding: 2px 6px; border-radius: 50%;
    }

    /* ====== HERO ====== */
    .hero {
      text-align: center;
      padding: 90px 20px 50px;
    }
    .hero h1 {
      font-size: 80px; font-weight: 900;
      letter-spacing: 4px; text-transform: uppercase;
      margin-bottom: 20px; color: #111;
    }
    .hero .tagline {
      display: inline-block;
      background: #d4f000; color: #000;
      padding: 12px 40px; font-size: 20px;
      letter-spacing: 0.5px;
    }

    /* ====== GALERÍA DE PRODUCTOS ====== */
    .galeria {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 6px;
      margin-top: 40px;
    }
    .galeria .item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: #f4f4f4;
    }
    .galeria img {
      width: 100%; height: 480px;
      object-fit: cover; display: block;
      transition: transform 0.6s ease;
    }
    .galeria .item:hover img { transform: scale(1.06); }
    .galeria .overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.25);
      opacity: 0; transition: opacity 0.4s;
      display: flex; align-items: flex-end;
      padding: 25px;
    }
    .galeria .item:hover .overlay { opacity: 1; }
    .galeria .overlay span {
      color: #fff; font-size: 16px;
      letter-spacing: 1px; text-transform: uppercase;
      border-bottom: 2px solid #d4f000;
      padding-bottom: 4px;
    }

    /* ====== FOOTER ====== */
    footer {
      background: #111; color: #ccc;
      text-align: center; padding: 50px 20px 40px;
      margin-top: 60px;
    }
    footer .brand {
      font-size: 22px; font-weight: 900;
      letter-spacing: 3px; text-transform: uppercase;
      color: #d4f000; margin-bottom: 15px;
    }
    footer .social a {
      color: #ccc; text-decoration: none;
      margin: 0 15px; font-size: 14px;
      letter-spacing: 1px; transition: color 0.3s;
      display: inline-flex; align-items: center;
    }
    footer .social a:hover { color: #d4f000; }
    footer .social a svg { margin-right: 6px; vertical-align: middle; }
    footer p { margin-top: 25px; font-size: 13px; color: #777; }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 900px) {
      header { grid-template-columns: 1fr auto; }
      nav { grid-column: 1 / -1; border-top: 1px solid #e5e5e5; }
      nav a { padding: 15px 25px; }
      .hero h1 { font-size: 48px; }
      .galeria { grid-template-columns: 1fr; }
      .galeria img { height: 380px; }
    }
  </style>
</head>
<body>

  <!-- BARRA DE ANUNCIO -->
  <div class="announcement">
    Rebaja del 25% en todo, usando TEES25 al pagar
  </div>

  <!-- HEADER -->
  <header>
    <!-- Logo -->
    <div class="logo">T Shop</div>

    <!-- Menú -->
    <nav>
      <ul>
        <li><a href="#">Nuevo</a></li>
        <li><a href="#">Mujer</a></li>
        <li><a href="#">Hombre</a></li>

    </nav>

    <!-- Acciones -->
    <div class="acciones">
      <a href="#"><span class="icon">👤</span> Entrar</a>
      <a href="#" class="carrito">
        <span class="icon">🛍️</span>
        <span class="badge">0</span>
      </a>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>T Shop</h1>
    <div class="tagline">Playeras para todos</div>
  </section>

  <!-- GALERÍA DE PRENDAS -->
  <section class="galeria">
    <div class="item">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&q=80" alt="Playera blanca">

    </div>
    <div class="item">
      <img src="https://images.unsplash.com/photo-1503341504253-dff4815485f1?w=800&q=80" alt="Playera negra">
      <div class="overlay"><span>Playera Negra</span></div>
    </div>
    <div class="item">

      <div class="overlay"><span>Estampada</span></div>
    </div>
    <div class="item">
      <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=800&q=80" alt="Playera oversize">
      <div class="overlay"><span>Oversize</span></div>
    </div>
    <div class="item">
      <img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?w=800&q=80" alt="Playera deportiva">
      <div class="overlay"><span>Deportiva</span></div>
    </div>
    <div class="item">
      <img src="https://images.unsplash.com/photo-1554568218-0f1715e72254?w=800&q=80" alt="Playera urbana">
      <div class="overlay"><span>Urbana</span></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="brand">T Shop</div>
    <div class="social">
      <a href="https://www.youtube.com/@venta.ropa-00" target="_blank" rel="noopener" aria-label="YouTube">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        YouTube

      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
      <a href="#">TikTok</a>
    </div>
    <p>© 2025 T Shop — Todos los derechos reservados</p>
  </footer>

</body>
</html>
